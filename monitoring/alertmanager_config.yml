# Alertmanager configuration for NepalAQI-Ops
route:
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "telegram"

receivers:
  - name: "telegram"
    webhook_configs:
      - url: "http://fastapi:8000/webhook/alertmanager"
        send_resolved: true
